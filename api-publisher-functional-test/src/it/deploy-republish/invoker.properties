# 1: first publish. 2: same files again, every release skips. 3: a changed file under the same
# version, which fails. No `clean` after the first run: the remote repository lives in the project
# directory and must survive between the invocations anyway, but target/ is left alone too.
invoker.goals.1 = clean deploy
invoker.goals.2 = deploy
invoker.goals.3 = deploy
invoker.profiles.3 = changed-schemas
invoker.buildResult.3 = failure
